<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rocky">
  <title>Rocky — pentaradial Eridian (Project Hail Mary)</title>
  <!-- five radial stony legs (pentaradial symmetry) -->
  <polygon points="32,3.5 38.6,23.0 58.8,23.3 42.6,35.5 48.7,55.0 32,43.2 15.3,55.0 21.4,35.5 5.2,23.3 25.4,23.0"
           fill="#8b7355" stroke="#3f3326" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- central rock carapace -->
  <polygon points="38.6,23.0 42.6,35.5 32,43.2 21.4,35.5 25.4,23.0"
           fill="#6b5744" stroke="#3f3326" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- carapace facets -->
  <g stroke="#3f3326" stroke-width="1.1" opacity="0.55" stroke-linecap="round">
    <line x1="32" y1="31.5" x2="32" y2="43.2"/>
    <line x1="32" y1="31.5" x2="38.6" y2="23.0"/>
    <line x1="32" y1="31.5" x2="42.6" y2="35.5"/>
    <line x1="32" y1="31.5" x2="25.4" y2="23.0"/>
    <line x1="32" y1="31.5" x2="21.4" y2="35.5"/>
  </g>
  <circle cx="29" cy="28" r="2.3" fill="#a4895f" opacity="0.7"/>
</svg>
